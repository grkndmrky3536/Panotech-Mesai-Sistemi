<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PANOTECH - BULUT SİSTEMİ</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 30px; }
        .card { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-top: 6px solid #b33a1b; }
        h2 { color: #b33a1b; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #6b46c1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #553c9a; }
        #durum { text-align: center; font-weight: bold; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
        .ok { background: #d4edda; color: #155724; }
        .hata { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <div id="durum">Bağlantı Kuruluyor...</div>
    <h2>🛠 PANOTECH PERSONEL KAYIT</h2>
    <input type="text" id="ad" placeholder="Ad Soyad">
    <input type="text" id="user" placeholder="Kullanıcı Adı">
    <input type="password" id="pass" placeholder="Şifre">
    <input type="number" id="maas" placeholder="Net Maaş (TL)">
    <select id="unvan">
        <option value="">Ünvan Seçin</option>
        <option>Usta Başı</option>
        <option>Teknik Destek</option>
        <option>Montaj Personeli</option>
    </select>
    <button onclick="kaydet()">BULUTA GÖNDER</button>
</div>

<script>
    const AYAR = {
        token: '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',
        sahip: 'grkndmrky3536',
        depo: 'panotech-data'
    };

    async function baglantiyiKontrolEt() {
        const d = document.getElementById('durum');
        try {
            const r = await fetch(`https://api.github.com/repos/${AYAR.sahip}/${AYAR.depo}/contents/data.json`, {
                headers: { 'Authorization': `token ${AYAR.token}` }
            });
            if(!r.ok) throw new Error();
            const json = await r.json();
            d.innerText = "✅ BAĞLANTI AKTİF"; d.className = "ok";
            return { icerik: JSON.parse(atob(json.content)), sha: json.sha };
        } catch (e) {
            d.innerText = "❌ BAĞLANTI HATASI!"; d.className = "hata";
        }
    }

    async function kaydet() {
        const veri = await baglantiyiKontrolEt();
        if(!veri) return;

        const yeni = {
            name: document.getElementById('ad').value,
            user: document.getElementById('user').value,
            pass: document.getElementById('pass').value,
            salary: document.getElementById('maas').value,
            title: document.getElementById('unvan').value
        };

        veri.icerik.users.push(yeni);

        const r = await fetch(`https://api.github.com/repos/${AYAR.sahip}/${AYAR.depo}/contents/data.json`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${AYAR.token}` },
            body: JSON.stringify({
                message: "yeni personel",
                content: btoa(unescape(encodeURIComponent(JSON.stringify(veri.icerik, null, 2)))),
                sha: veri.sha
            })
        });

        if(r.ok) alert("Personel Buluta Kaydedildi!");
    }
    window.onload = baglantiyiKontrolEt;
</script>
</body>
</html>
