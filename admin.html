<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANOTECH | Personel Yönetim Sistemi</title>
    <style>
        :root { --panotech-red: #b33a1b; --dark: #2d3748; --accent: #6b46c1; --bg: #f7fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid var(--panotech-red); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #edf2f7; margin-bottom: 25px; padding-bottom: 15px; }
        h2 { color: var(--panotech-red); margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        
        #status-indicator { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .online { background: #dcfce7; color: #166534; }
        .offline { background: #fee2e2; color: #991b1b; }

        .form-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        input, select { padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; outline: none; transition: all 0.3s; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.1); }
        
        .checkbox-group { grid-column: 1 / -1; display: flex; gap: 15px; align-items: center; padding: 10px; border-top: 1px solid #e2e8f0; margin-top: 5px; }
        .checkbox-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 14px; font-weight: 600; }

        .btn-submit { grid-column: 1 / -1; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { background: #553c9a; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(107, 70, 193, 0.3); }

        table { width: 100%; border-collapse: collapse; margin-top: 30px; border-radius: 10px; overflow: hidden; }
        th { background: #edf2f7; padding: 15px; text-align: left; color: #4a5568; font-size: 13px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #edf2f7; font-size: 15px; }
        tr:hover { background: #fdfdfd; }
        
        .badge { background: #e2e8f0; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-right: 4px; }
        .delete-btn { color: #e53e3e; cursor: pointer; border: none; background: none; font-weight: bold; }
        .delete-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🛠 PANOTECH ADMİN PANELİ</h2>
        <div id="status-indicator" class="offline">BULUT BAĞLANTISI YOK</div>
    </div>

    <div class="form-section">
        <input type="text" id="name" placeholder="Ad Soyad">
        <input type="text" id="user" placeholder="Kullanıcı Adı">
        <input type="password" id="pass" placeholder="Şifre">
        <input type="number" id="salary" placeholder="Net Maaş (TL)">
        
        <select id="title">
            <option value="">Ünvan Seçin</option>
            <option>Usta Başı</option>
            <option>Teknik Destek</option>
            <option>Montaj Personeli</option>
            <option>Ofis Personeli</option>
            <option>Stajyer</option>
        </select>
        
        <select id="edu">
            <option value="">Eğitim Durumu</option>
            <option>İlkokul</option>
            <option>Ortaokul</option>
            <option>Lise</option>
            <option>Üniversite</option>
        </select>

        <div class="checkbox-group">
            <span style="font-weight: bold; color: #4a5568;">Ehliyetler:</span>
            <label><input type="checkbox" value="B" class="lic"> B</label>
            <label><input type="checkbox" value="BE" class="lic"> BE</label>
            <label><input type="checkbox" value="C" class="lic"> C</label>
            <label><input type="checkbox" value="D" class="lic"> D</label>
            <label><input type="checkbox" value="G" class="lic"> G (Forklift/Beko)</label>
        </div>

        <button class="btn-submit" onclick="saveToCloud()">PERSONELİ SİSTEME VE BULUTA KAYDET</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Personel Bilgisi</th>
                <th>Ünvan</th>
                <th>Net Maaş</th>
                <th>Belgeler</th>
                <th>İşlem</th>
            </tr>
        </thead>
        <tbody id="userList">
            <!-- Veriler Buraya Gelecek -->
        </tbody>
    </table>
</div>

<script>
    // Gürkan, buradaki tokeni yeni aldığın çalışan token ile değiştir
    const GITHUB_CONFIG = {
        token: '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',
        owner: 'grkndmrky3536',
        repo: 'panotech-data',
        path: 'data.json'
    };

    async function fetchData() {
        const status = document.getElementById('status-indicator');
        try {
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` }
            });
            
            if (!response.ok) throw new Error("Bağlantı Başarısız");
            
            const data = await response.json();
            const content = JSON.parse(atob(data.content));
            
            status.innerText = "✅ BULUT BAĞLANTISI AKTİF";
            status.className = "online";
            
            renderTable(content.users);
            return { content, sha: data.sha };
        } catch (error) {
            status.innerText = "❌ BAĞLANTI HATASI (TOKEN VEYA DOSYA)";
            status.className = "offline";
            console.error(error);
        }
    }

    function renderTable(users) {
        const tbody = document.getElementById('userList');
        tbody.innerHTML = users.map(u => `
            <tr>
                <td><strong>${u.name}</strong><br><small style="color:gray">${u.user}</small></td>
                <td><span class="badge" style="background:#fef3c7; color:#92400e">${u.title}</span></td>
                <td><strong>${u.salary} ₺</strong></td>
                <td>${u.license ? u.license.split(',').map(l => `<span class="badge">${l}</span>`).join('') : '-'}</td>
                <td><button class="delete-btn" onclick="deleteUser('${u.user}')">SİL</button></td>
            </tr>
        `).join('');
    }

    async function saveToCloud() {
        const db = await fetchData();
        if (!db) return;

        const licenses = Array.from(document.querySelectorAll('.lic:checked')).map(c => c.value);
        
        const newUser = {
            name: document.getElementById('name').value,
            user: document.getElementById('user').value,
            pass: document.getElementById('pass').value,
            salary: document.getElementById('salary').value,
            title: document.getElementById('title').value,
            edu: document.getElementById('edu').value,
            license: licenses.join(',')
        };

        if (!newUser.name || !newUser.user || !newUser.pass) {
            alert("Lütfen temel bilgileri (Ad, Kullanıcı, Şifre) boş bırakmayın!");
            return;
        }

        db.content.users.push(newUser);

        const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
        const updateRes = await fetch(url, {
            method: 'PUT',
            headers: { 
                'Authorization': `token ${GITHUB_CONFIG.token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: "Yeni personel eklendi: " + newUser.name,
                content: btoa(unescape(encodeURIComponent(JSON.stringify(db.content, null, 2)))),
                sha: db.sha
            })
        });

        if (updateRes.ok) {
            alert("Personel başarıyla buluta gönderildi!");
            location.reload();
        } else {
            alert("Kayıt sırasında bir hata oluştu!");
        }
    }

    window.onload = fetchData;
</script>
</body>
</html>
