<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panotech - Yönetici Paneli</title>
    <style>
        :root { --panotech-orange: #b33a1b; --admin-purple: #6b46c1; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        .header { background: white; padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--panotech-orange); }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .section-title { color: var(--admin-purple); border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-top: 20px; font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .btn-purple { background: var(--admin-purple); color: white; }
        .license-box { display: flex; flex-wrap: wrap; gap: 10px; background: #eee; padding: 10px; border-radius: 6px; margin-top: 5px; }
        .staff-card { border-left: 5px solid var(--admin-purple); padding: 15px; background: #fdf2f2; margin-top: 10px; border-radius: 8px; position: relative; }
        .tag { background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 5px; }
    </style>
</head>
<body>

<div class="header">
    <div style="color:var(--panotech-orange); font-weight:900;">PANOTECH YÖNETİCİ</div>
    <button onclick="location.href='index.html'" style="cursor:pointer; background:none; border:1px solid #ccc; padding:5px 10px; border-radius:4px;">Güvenli Çıkış</button>
</div>

<div class="container">
    <h3 class="section-title">👤 PERSONEL KAYIT FORMU</h3>
    <div class="grid">
        <input type="text" id="name" placeholder="Ad Soyad">
        <input type="text" id="user" placeholder="Kullanıcı Adı">
        <input type="password" id="pass" placeholder="Şifre">
        <select id="gender"><option value="">Cinsiyet</option><option value="Erkek">Erkek</option><option value="Kadın">Kadın</option></select>
        <input type="number" id="age" placeholder="Yaş">
    </div>

    <div class="grid">
        <select id="edu">
            <option value="">Eğitim Durumu (Diploma)</option>
            <option value="İlkokul">İlkokul</option>
            <option value="Lise">Lise</option>
            <option value="Önlisans">Önlisans</option>
            <option value="Üniversite">Üniversite</option>
        </select>
        <select id="unvan">
            <option value="">Ünvan Seçin</option>
            <option value="PANO MONTAJ USTASI">PANO MONTAJ USTASI</option>
            <option value="TEKNİK DESTEK ELAMANI">TEKNİK DESTEK ELAMANI</option>
            <option value="MUHASEBECİ">MUHASEBECİ</option>
        </select>
    </div>

    <p style="font-size:12px; margin-bottom:5px; font-weight:bold;">SÜRÜCÜ BELGELERİ:</p>
    <div class="license-box" id="licenses">
        <label><input type="checkbox" value="B"> B</label>
        <label><input type="checkbox" value="BE"> BE</label>
        <label><input type="checkbox" value="C"> C</label>
        <label><input type="checkbox" value="D"> D</label>
        <label><input type="checkbox" value="G"> G (İş Makinası)</label>
    </div>

    <button class="btn btn-purple" onclick="saveStaff()">PERSONELİ SİSTEME TANIMLA</button>

    <h3 class="section-title">📋 KAYITLI PERSONEL LİSTESİ</h3>
    <div id="staffList"></div>
</div>

<script>
    function saveStaff() {
        const staff = {
            name: document.getElementById('name').value,
            user: document.getElementById('user').value,
            pass: document.getElementById('pass').value,
            gender: document.getElementById('gender').value,
            age: document.getElementById('age').value,
            edu: document.getElementById('edu').value,
            unvan: document.getElementById('unvan').value,
            licenses: Array.from(document.querySelectorAll('#licenses input:checked')).map(cb => cb.value)
        };

        if(!staff.user || !staff.pass) return alert("Kullanıcı adı ve şifre zorunludur!");

        let db = JSON.parse(localStorage.getItem('panotech_db')) || { users: [] };
        db.users.push(staff);
        localStorage.setItem('panotech_db', JSON.stringify(db));
        alert("Personel Kaydedildi!");
        renderList();
    }

    function renderList() {
        const list = document.getElementById('staffList');
        const db = JSON.parse(localStorage.getItem('panotech_db')) || { users: [] };
        list.innerHTML = db.users.map(u => `
            <div class="staff-card">
                <b>${u.name}</b> (${u.unvan}) <br>
                <span class="tag">${u.gender}</span> <span class="tag">${u.age} Yaş</span> 
                <span class="tag">${u.edu}</span> <span class="tag">Ehliyet: ${u.licenses.join(', ')}</span>
            </div>
        `).join('');
    }
    renderList();
</script>

</body>
</html>
