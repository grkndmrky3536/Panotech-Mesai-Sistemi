<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panotech — Giriş</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #C0392B;
            --red-dark: #922b21;
            --red-glow: rgba(192,57,43,0.35);
            --black: #0d0d0d;
            --white: #f8f5f0;
            --gray: #aaa;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--black);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Arka plan grid deseni */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(192,57,43,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(192,57,43,0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* Sol kırmızı panel */
        .left-panel {
            width: 55%;
            background: var(--red);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            overflow: hidden;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            right: -80px;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            height: 160%;
            background: var(--black);
            clip-path: polygon(40% 0%, 100% 0%, 100% 100%, 0% 100%);
        }

        /* Büyük dekoratif daire */
        .deco-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 80px solid rgba(0,0,0,0.12);
            bottom: -150px;
            right: -80px;
            pointer-events: none;
        }

        .brand {
            position: relative;
            z-index: 2;
        }

        .brand-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 7rem;
            color: white;
            line-height: 0.9;
            letter-spacing: 4px;
            text-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }

        .brand-line {
            width: 60px;
            height: 4px;
            background: white;
            margin: 20px 0;
            opacity: 0.7;
        }

        .brand-sub {
            font-family: 'DM Sans', sans-serif;
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.8;
        }

        .brand-tagline {
            margin-top: 40px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Sağ giriş paneli */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 60px 60px 100px;
        }

        .login-box {
            width: 100%;
            max-width: 360px;
        }

        .login-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            color: var(--white);
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .login-sub {
            color: var(--gray);
            font-size: 0.85rem;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .field {
            margin-bottom: 20px;
            position: relative;
        }

        .field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s;
        }

        .field input:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--red);
            box-shadow: 0 0 0 3px var(--red-glow);
        }

        .field input::placeholder { color: rgba(255,255,255,0.2); }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-login:hover {
            background: var(--red-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--red-glow);
        }

        .btn-login:hover::before { opacity: 1; }
        .btn-login:active { transform: translateY(0); }

        .error-msg {
            display: none;
            background: rgba(192,57,43,0.15);
            border: 1px solid rgba(192,57,43,0.4);
            color: #ff8a7a;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 16px;
            text-align: center;
        }

        .footer-note {
            margin-top: 40px;
            color: rgba(255,255,255,0.15);
            font-size: 0.72rem;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Animasyonlar */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .left-panel .brand { animation: fadeUp 0.8s ease both; }
        .login-box { animation: fadeUp 0.8s ease 0.2s both; }

        @media (max-width: 700px) {
            body { flex-direction: column; }
            .left-panel { width: 100%; padding: 40px; }
            .left-panel::after { display: none; }
            .brand-name { font-size: 4rem; }
            .right-panel { padding: 40px 30px; }
            .deco-circle { display: none; }
        }
    </style>
</head>
<body>

<div class="left-panel">
    <div class="deco-circle"></div>
    <div class="brand">
        <div class="brand-name">PANO<br>TECH</div>
        <div class="brand-line"></div>
        <div class="brand-sub">
            ASANSÖR KONTROL SİSTEMLERİ<br>
            SAN. VE TİC. LTD. ŞTİ.
        </div>
        <div class="brand-tagline">Personel Yönetim & Mesai Takip Sistemi</div>
    </div>
</div>

<div class="right-panel">
    <div class="login-box">
        <div class="login-title">SİSTEM GİRİŞİ</div>
        <div class="login-sub">Kullanıcı bilgilerinizi girerek devam edin.</div>

        <div class="field">
            <label>Kullanıcı Adı</label>
            <input type="text" id="username" placeholder="kullanici_adi" autocomplete="off">
        </div>
        <div class="field">
            <label>Şifre</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn-login" onclick="handleLogin()">GİRİŞ YAP →</button>

        <div class="error-msg" id="errMsg">⚠ Hatalı kullanıcı adı veya şifre!</div>

        <div class="footer-note">PANOTECH © 2026 — TÜM HAKLARI SAKLIDIR</div>
    </div>
</div>

<script>
    const DEFAULT_ADMIN = { user: "admin", pass: "1234", role: "admin", name: "Gürkan Demirkaya" };

    document.addEventListener('keydown', e => { if(e.key === 'Enter') handleLogin(); });

    function handleLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const err = document.getElementById('errMsg');

        const db = JSON.parse(localStorage.getItem('panotech_db')) || { users: [], records: [] };
        const allUsers = [DEFAULT_ADMIN, ...db.users];
        const found = allUsers.find(x => x.user === u && x.pass === p);

        if (found) {
            err.style.display = 'none';
            sessionStorage.setItem('loggedUser', JSON.stringify(found));
            document.querySelector('.btn-login').textContent = 'YÖNLENDİRİLİYOR...';
            setTimeout(() => {
                location.href = found.role === 'admin' ? 'admin.html' : 'personel.html';
            }, 400);
        } else {
            err.style.display = 'block';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    }
</script>
</body>
</html>
