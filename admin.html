<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANOTECH YÖNETİCİ</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f9; margin: 0; padding: 0; }
        .header { background: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #b33a1b; }
        .header h1 { color: #b33a1b; font-size: 1.2rem; margin: 0; text-transform: uppercase; }
        
        .main-container { max-width: 1000px; margin: 30px auto; background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; }
        
        .section-title { color: #6b46c1; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .full-width { grid-column: span 2; }
        
        .btn-delete {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-delete:hover {
            background: #c53030;
            transform: scale(1.05);
        }

        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 100%; box-sizing: border-box; }
        
        .license-area { background: #f0f0f0; padding: 15px; border-radius: 5px; margin: 15px 0; }
        .license-grid { display: flex; gap: 20px; font-size: 0.9rem; }
        
        .btn-submit { background: #6b46c1; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-submit:hover { background: #553c9a; }

        .staff-card { background: #fff5f5; border-radius: 8px; padding: 15px; margin-bottom: 10px; border-left: 5px solid #6b46c1; }
        .staff-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 8px; }
        .staff-info { display: flex; gap: 10px; flex-wrap: wrap; }
        .badge { background: #e2e8f0; padding: 3px 10px; border-radius: 4px; font-size: 0.75rem; color: #4a5568; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        th { text-align: left; background: #6b46c1; color: white; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .multiplier { font-weight: bold; color: #b33a1b; }
    </style>
</head>
<body>

<div class="header">
    <h1>PANOTECH YÖNETİCİ</h1>
    <button onclick="location.href='index.html'" style="cursor:pointer; background:white; border:1px solid #ddd; padding:5px 15px; border-radius:4px;">Güvenli Çıkış</button>
</div>

<div class="main-container">
    <div class="section-title">👤 PERSONEL KAYIT FORMU</div>
    <div class="form-grid">
        <input type="text" id="pName" placeholder="Ad Soyad">
        <input type="text" id="pUser" placeholder="Kullanıcı Adı">
        <input type="password" id="pPass" placeholder="Şifre">
        <input type="number" id="pSalary" placeholder="Net Maaş (TL)">
    </div>
    <div class="form-grid">
        <select id="pGender"><option>Cinsiyet</option><option>Erkek</option><option>Kadın</option></select>
        <input type="number" id="pAge" placeholder="Yaş">
        <select id="pEdu" class="full-width"><option>Eğitim Durumu (Diploma)</option><option>Lise</option><option>Önlisans</option><option>Lisans</option></select>
        <select id="pTitle" class="full-width">
            <option value="">Ünvan Seçin</option>
            <option value="TEKNİK DESTEK ELAMANI">TEKNİK DESTEK ELAMANI</option>
            <option value="PANO MONTAJ USTASI">PANO MONTAJ USTASI</option>
        </select>
    </div>

    <div class="license-area">
        <strong>SÜRÜCÜ BELGELERİ:</strong>
        <div class="license-grid" style="margin-top:10px;">
            <label><input type="checkbox" name="lic" value="B"> B</label>
            <label><input type="checkbox" name="lic" value="BE"> BE</label>
            <label><input type="checkbox" name="lic" value="C"> C</label>
            <label><input type="checkbox" name="lic" value="D"> D</label>
            <label><input type="checkbox" name="lic" value="G"> G (İş Makinası)</label>
        </div>
    </div>
    <button class="btn-submit" onclick="saveStaff()">PERSONELİ SİSTEME TANIMLA</button>

    <div class="section-title" style="margin-top:40px;">📋 KAYITLI PERSONEL LİSTESİ</div>
    <div id="staffList"></div>

    <div class="section-title" style="margin-top:40px;">📊 MESAİ VE İZİN HAREKETLERİ</div>
    <div id="movementsTable"></div>
</div>

<script>
    function saveStaff() {
        const uVal = document.getElementById('pUser').value.trim();
        if(!uVal) { alert("Lütfen kullanıcı adı girin!"); return; }

        const salary = document.getElementById('pSalary').value;
        const licenses = Array.from(document.querySelectorAll('input[name="lic"]:checked')).map(c => c.value);
        
        const newStaff = {
            name: document.getElementById('pName').value,
            user: uVal,
            pass: document.getElementById('pPass').value,
            salary: parseFloat(salary) || 0,
            hourlyRate: (parseFloat(salary) || 0) / 225,
            gender: document.getElementById('pGender').value,
            age: document.getElementById('pAge').value,
            edu: document.getElementById('pEdu').value,
            title: document.getElementById('pTitle').value,
            license: licenses.join(', '),
            role: 'personel'
        };

        let db = JSON.parse(localStorage.getItem('panotech_db')) || { users: [], records: [] };
        db.users.push(newStaff);
        localStorage.setItem('panotech_db', JSON.stringify(db));
        location.reload();
    }

    function deleteStaff(username) {
        // Konsolda hangi ismin geldiğini görmek için
        console.log("Silinmeye çalışılan:", username);
        
        if(confirm(username + " kullanıcısını silmek istediğinize emin misiniz?")) {
            let db = JSON.parse(localStorage.getItem('panotech_db')) || { users: [], records: [] };
            
            // Filtreleme yaparken hem kullanıcı adını kontrol et hem de boşlukları temizle
            db.users = db.users.filter(u => u.user !== username);
            db.records = db.records.filter(r => r.owner !== username);
            
            localStorage.setItem('panotech_db', JSON.stringify(db));
            renderAll(); 
        }
    }

    function calculateRow(r, hourlyRate) {
        if(r.type === 'İzin') return { cost: 0, multi: 'İzinli' };
        const date = new Date(r.startDate);
        const day = date.getDay();
        const start = new Date(`${r.startDate}T${r.in}`);
        const end = new Date(`${r.startDate}T${r.out}`);
        const hours = (end - start) / (1000 * 60 * 60);

        if(day === 0) return { cost: hours * hourlyRate * 2, multi: 'x2.0 (Pazar)' };
        if(day === 6) return { cost: hours * hourlyRate * 1.5, multi: 'x1.5 (Cmt)' };
        if(r.out > "18:00") return { cost: hours * hourlyRate * 1.5, multi: 'x1.5 (H.İçi Akşam)' };
        
        return { cost: hours * hourlyRate, multi: 'Normal' };
    }

    function renderAll() {
        const db = JSON.parse(localStorage.getItem('panotech_db')) || { users: [], records: [] };
        const staffDiv = document.getElementById('staffList');
        
        staffDiv.innerHTML = ""; // İçeriği temizle

        db.users.forEach(u => {
            const card = document.createElement('div');
            card.className = 'staff-card';
            // onclick olayını dinamik olarak ekleyerek tırnak işareti hatalarını engelliyoruz
            card.innerHTML = `
                <div class="staff-header">
                    <span>${u.name} (${u.title})</span> 
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span>Maaş: ${u.salary} ₺</span>
                        <button class="btn-delete">SİL</button>
                    </div>
                </div>
                <div class="staff-info">
                    <span class="badge">${u.gender}</span> <span class="badge">${u.age} Yaş</span> 
                    <span class="badge">${u.edu}</span> <span class="badge">Ehliyet: ${u.license}</span>
                </div>
            `;
            
            // Butona tıklama özelliğini burada güvenli şekilde bağlıyoruz
            card.querySelector('.btn-delete').onclick = () => deleteStaff(u.user);
            staffDiv.appendChild(card);
        });

        const moveDiv = document.getElementById('movementsTable');
        let tableHtml = `<table><tr><th>Personel</th><th>Tür</th><th>Tarih</th><th>Saat</th><th>Çarpan</th><th>Hakediş</th></tr>`;
        db.records.forEach(r => {
            const staff = db.users.find(u => u.user === r.owner) || { hourlyRate: 0 };
            const calc = calculateRow(r, staff.hourlyRate);
            tableHtml += `<tr>
                <td>${r.ownerName}</td>
                <td>${r.type}</td>
                <td>${r.startDate} ${r.endDate ? '- ' + r.endDate : ''}</td>
                <td>${r.in || '-'} / ${r.out || '-'}</td>
                <td class="multiplier">${calc.multi}</td>
                <td>${calc.cost.toFixed(2)} ₺</td>
            </tr>`;
        });
        moveDiv.innerHTML = tableHtml + `</table>`;
    }

    renderAll();
</script>
</body>
</html>
