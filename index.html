<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PANOTECH | Personel Giriş</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a202c; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #b33a1b; margin-bottom: 30px; font-size: 24px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #edf2f7; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #b33a1b; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        button:hover { background: #8e2e15; transform: scale(1.02); }
        #msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>PANOTECH SİSTEMİ</h1>
    <input type="text" id="user" placeholder="Kullanıcı Adı">
    <input type="password" id="pass" placeholder="Şifre">
    <button onclick="islemYap('Giriş')">MESAİ BAŞLAT</button>
    <button onclick="islemYap('Çıkış')" style="background:#4a5568;">MESAİ BİTİR</button>
    <div id="msg"></div>
</div>

<script>
    const CONFIG = {
        token: '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', // Kendi çalışan tokenını buraya koy
        owner: 'grkndmrky3536',
        repo: 'panotech-data'
    };

    async function islemYap(tip) {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const msg = document.getElementById('msg');
        
        msg.innerText = "Bağlanıyor...";

        try {
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/data.json`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${CONFIG.token}` } });
            const data = await res.json();
            const db = JSON.parse(atob(data.content));

            // Kullanıcı Kontrolü
            const personel = db.users.find(x => x.user === u && x.pass === p);
            
            if (!personel) {
                msg.innerText = "❌ Hatalı Kullanıcı veya Şifre!";
                msg.style.color = "red";
                return;
            }

            // Kayıt Ekleme
            const yeniKayit = {
                ad: personel.name,
                islem: tip,
                tarih: new Date().toLocaleString('tr-TR')
            };
            
            db.records.push(yeniKayit);

            // GitHub Güncelleme
            await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${CONFIG.token}` },
                body: JSON.stringify({
                    message: tip + " kaydı yapıldı",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2)))),
                    sha: data.sha
                })
            });

            msg.innerText = "✅ " + tip + " İşlemi Başarılı!";
            msg.style.color = "green";
        } catch (e) {
            msg.innerText = "❌ Bağlantı Hatası!";
        }
    }
</script>
</body>
</html>
