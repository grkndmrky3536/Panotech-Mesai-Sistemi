<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panotech Asansör Giriş</title>
    <style>
        /* Görseldeki Panotech Turuncusu ve Gri Tonları */
        :root { 
            --panotech-orange: #b33a1b; 
            --panotech-text-gray: #4a4a4a; 
            --panotech-light-gray: #5e5e5e;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: "Times New Roman", Times, serif; /* Görseldeki font stili */
            background-color: var(--panotech-orange);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05); /* Çok hafif şeffaf beyazlık */
            padding: 50px;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        /* Görseldeki Panotech Yazı Fontu ve Rengi */
        .brand-name {
            color: var(--panotech-text-gray);
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }

        .brand-sub {
            color: var(--panotech-light-gray);
            font-size: 0.9rem;
            letter-spacing: 1px;
            line-height: 1.4;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .login-form {
            background: white;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 2px;
            box-sizing: border-box;
            font-family: serif;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: var(--panotech-text-gray);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #333;
        }

        /* İkon simülasyonu */
        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--panotech-orange);
            border: 3px solid var(--panotech-text-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--panotech-text-gray);
            font-weight: bold;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-area">
        <h1 class="brand-name">PANOTECH</h1>
    </div>
    <div class="brand-sub">
        ASANSÖR KONTROL SİSTEMLERİ <br>
        SAN. ve TİC. LTD. ŞTİ.
    </div>

    <div class="login-form" style="margin-top: 40px;">
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="password" id="password" placeholder="Şifre">
        <button onclick="handleLogin()">Giriş Yap</button>
    </div>
</div>

<script>
    const users = [
        { user: "admin", pass: "1234", role: "admin", name: "Gürkan Demirkaya" }
    ];

    function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        // Önce localStorage'dan personelleri kontrol et (yönetici panelinde eklediklerin için)
        const db = JSON.parse(localStorage.getItem('panotech_db')) || { users: [] };
        const allUsers = [...users, ...db.users];

        const foundUser = allUsers.find(x => x.user === u && x.pass === p);

        if (foundUser) {
            sessionStorage.setItem('loggedUser', JSON.stringify(foundUser));
            if (foundUser.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'personel.html';
            }
        } else {
            alert("Hatalı kullanıcı adı veya şifre!");
        }
    }
</script>

</body>
</html>
