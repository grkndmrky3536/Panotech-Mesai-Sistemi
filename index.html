<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panotech Giriş Sistemi</title>
    <style>
        :root { 
            --panotech-orange: #b33a1b; 
            --bg-dark: #1a1a1a; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--panotech-orange); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .login-container {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 350px;
            text-align: center;
        }
        .brand-name { color: var(--panotech-orange); font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
        .brand-sub { font-size: 0.8rem; color: #666; margin-bottom: 30px; letter-spacing: 2px; }
        input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            background-color: var(--panotech-orange); color: white;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="brand-name">PANOTECH</div>
    <div class="brand-sub">YÖNETİM SİSTEMİ</div>
    
    <input type="text" id="username" placeholder="Kullanıcı Adı">
    <input type="password" id="password" placeholder="Şifre">
    <button onclick="handleLogin()">SİSTEME GİRİŞ YAP</button>
</div>

<script>
    // GitHub üzerinde statik çalışacağı için kullanıcı verilerini şimdilik burada tutuyoruz
    const users = [
        { user: "admin", pass: "1234", role: "admin", name: "Gürkan Demirkaya" },
        { user: "personel1", pass: "5678", role: "personel", name: "Personel Kullanıcı" }
    ];

    function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        const foundUser = users.find(x => x.user === u && x.pass === p);

        if (foundUser) {
            // Kullanıcı bilgilerini tarayıcı hafızasına alıyoruz
            sessionStorage.setItem('loggedUser', JSON.stringify(foundUser));
            
            // Yetkiye göre yönlendirme yapıyoruz
            if (foundUser.role === 'admin') {
                window.location.href = 'admin.html'; // Yönetici paneline git
            } else {
                window.location.href = 'personel.html'; // Personel paneline git
            }
        } else {
            alert("Hatalı kullanıcı adı veya şifre!");
        }
    }
</script>

</body>
</html>
