<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PANOTECH - GİRİŞ</title>
    <style>
        body { background: #2d3748; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 10px; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #b33a1b; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="login-card">
    <h2 style="color:#b33a1b">PANOTECH</h2>
    <input type="text" id="u" placeholder="Kullanıcı Adı">
    <input type="password" id="p" placeholder="Şifre">
    <button onclick="login()">GİRİŞ YAP</button>
</div>

<script>
    const GITHUB_CONFIG = {
        token: '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',
        owner: 'grkndmrky3536',
        repo: 'panotech-data',
        path: 'data.json'
    };

    async function login() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;

        if(u === 'admin' && p === '3512') {
            location.href = 'admin.html';
            return;
        }

        try {
            const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` } });
            const data = await res.json();
            const db = JSON.parse(atob(data.content));

            const user = db.users.find(x => x.user === u && x.pass === p);
            if(user) {
                sessionStorage.setItem('loggedUser', JSON.stringify(user));
                location.href = 'personel.html';
            } else {
                alert("Hatalı kullanıcı veya şifre!");
            }
        } catch (e) {
            alert("Bağlantı hatası!");
        }
    }
</script>
</body>
</html>
