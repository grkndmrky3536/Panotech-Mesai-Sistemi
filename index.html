<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panotech Asansör Giriş</title>
    <style>
        :root { 
            --panotech-orange: #b33a1b; /* Görseldeki arka plan tonu */
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: "Times New Roman", Times, serif;
            background-color: var(--panotech-orange);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* Ana Başlık: Daha Büyük ve Beyaz */
        .brand-name {
            color: white;
            font-size: 5rem; /* Boyut büyütüldü */
            font-weight: bold;
            letter-spacing: 4px;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); /* Derinlik için hafif gölge */
        }

        /* Alt Başlık: Daha Büyük ve Beyaz */
        .brand-sub {
            color: white;
            font-size: 1.2rem; /* Boyut büyütüldü */
            letter-spacing: 2px;
            line-height: 1.6;
            margin-top: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .login-form {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            margin-top: 50px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #eee;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1.1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--panotech-orange);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            background-color: #333;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            border-radius: 4px;
        }

        button:hover {
            background-color: #000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1 class="brand-name">PANOTECH</h1>
    <div class="brand-sub">
        ASANSÖR KONTROL SİSTEMLERİ <br>
        SAN. ve TİC. LTD. ŞTİ.
    </div>

    <div class="login-form">
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="password" id="password" placeholder="Şifre">
        <button onclick="handleLogin()">Sisteme Giriş Yap</button>
    </div>
</div>

<script>
    // Varsayılan yönetici hesabı
    const users = [
        { user: "admin", pass: "3512", role: "admin", name: "Gürkan Demirkaya" }
    ];

    function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        // Yönetici tarafından eklenen personelleri kontrol et
        const db = JSON.parse(localStorage.getItem('panotech_db')) || { users: [] };
        const allUsers = [...users, ...db.users];

        const foundUser = allUsers.find(x => x.user === u && x.pass === p);

        if (foundUser) {
            sessionStorage.setItem('loggedUser', JSON.stringify(foundUser));
            // Yetkiye göre yönlendirme
            if (foundUser.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'personel.html';
            }
        } else {
            alert("Hatalı kullanıcı adı veya şifre!");
        }
    }
</script>

</body>
</html>
