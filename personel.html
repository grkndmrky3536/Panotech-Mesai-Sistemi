<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANOTECH PERSONEL PANELİ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f9; margin: 0; padding: 0; }
        .header { background: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #b33a1b; }
        .header h1 { color: #b33a1b; font-size: 1.2rem; margin: 0; text-transform: uppercase; }
        #pdf-content { max-width: 900px; margin: 20px auto; background: white; border-radius: 8px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .profile-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .info-group { margin-bottom: 10px; }
        .label { color: #666; font-size: 0.85rem; display: block; }
        .value { font-weight: bold; color: #2d3748; font-size: 1.1rem; }
        .rates-container { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; display: flex; justify-content: space-around; margin-bottom: 25px; }
        .rate-item { text-align: center; }
        .rate-val { display: block; font-size: 1.2rem; font-weight: bold; color: #6b46c1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #6b46c1; color: white; padding: 12px; text-align: left; font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; }
        .summary-box { margin-top: 25px; padding: 20px; background: #fff5f5; border-radius: 8px; text-align: right; }
        .total-amount { font-size: 1.5rem; font-weight: bold; color: #b33a1b; }
        .action-buttons { max-width: 900px; margin: 10px auto; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-pdf { background: #2d3748; color: white; }
        .btn-logout { background: #e53e3e; color: white; }
    </style>
</head>
<body>

<div class="header">
    <h1>PANOTECH PERSONEL SİSTEMİ</h1>
    <button class="btn btn-logout" onclick="logout()">GÜVENLİ ÇIKIŞ</button>
</div>

<div class="action-buttons">
    <button class="btn btn-pdf" onclick="downloadPDF()">📄 EKSTREYİ PDF OLARAK İNDİR</button>
</div>

<div id="pdf-content">
    <div style="text-align: center; margin-bottom: 30px;">
        <h2 style="color: #b33a1b; margin: 0;">PERSONEL MAAŞ VE MESAİ EKSTRESİ</h2>
        <p id="currentDate" style="color: #718096; font-size: 0.9rem;"></p>
    </div>

    <div class="profile-section">
        <div>
            <div class="info-group">
                <span class="label">Ad Soyad</span>
                <span class="value" id="dispName">-</span>
            </div>
            <div class="info-group">
                <span class="label">Ünvan</span>
                <span class="value" id="dispTitle">-</span>
            </div>
        </div>
        <div>
            <div class="info-group">
                <span class="label">Ehliyet / Sertifika</span>
                <span class="value" id="dispLicense">B Sınıfı / Forklift / Bekolader</span>
            </div>
        </div>
    </div>

    <h3 style="color: #6b46c1; font-size: 1rem;">SAATLİK ÜCRET TARİFESİ</h3>
    <div class="rates-container">
        <div class="rate-item">
            <span class="label">Net Maaş</span>
            <span class="rate-val" id="rateSalary">0 ₺</span>
        </div>
        <div class="rate-item">
            <span class="label">Mesai (%50)</span>
            <span class="rate-val" id="rate15">0 ₺</span>
        </div>
        <div class="rate-item">
            <span class="label">Pazar/Tatil (%100)</span>
            <span class="rate-val" id="rate20">0 ₺</span>
        </div>
    </div>

    <h3 style="color: #6b46c1; font-size: 1rem;">SON HAREKETLER</h3>
    <table id="staffTable">
        <thead>
            <tr>
                <th>Tarih</th>
                <th>İşlem Türü</th>
            </tr>
        </thead>
        <tbody id="movementsBody"></tbody>
    </table>

    <div class="summary-box">
        <div style="color: #4a5568; margin-bottom: 5px;">GÜNCEL MAAŞ BİLGİSİ</div>
        <div class="total-amount" id="grandTotal">0.00 ₺</div>
    </div>
</div>

<script>
    // GitHub Ayarları
    const CONFIG = {
        token: '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', 
        owner: 'grkndmrky3536',
        repo: 'panotech-data'
    };

    function logout() {
        sessionStorage.removeItem('loggedUser');
        location.href = 'index.html';
    }

    async function renderPersonelData() {
        // SessionStorage kullanıyoruz ki tarayıcı kapanınca çıksın
        const loggedUser = JSON.parse(sessionStorage.getItem('loggedUser'));
        
        if(!loggedUser) { 
            location.href = 'index.html'; 
            return; 
        }

        try {
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/data.json`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${CONFIG.token}` } });
            const data = await res.json();
            const db = JSON.parse(atob(data.content));

            const user = db.users.find(u => u.user === loggedUser.user);
            const myRecords = db.records.filter(r => r.ad === user.name);

            // Profil Bilgileri
            document.getElementById('dispName').innerText = user.name;
            document.getElementById('dispTitle').innerText = user.title;
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('tr-TR') + " itibariyle";

            // Maaş ve Mesai Hesaplama (Maaş / 225 saat üzerinden)
            const maas = parseFloat(user.salary) || 0;
            const hRate = maas / 225; 
            
            document.getElementById('rateSalary').innerText = maas.toLocaleString('tr-TR') + " ₺";
            document.getElementById('rate15').innerText = (hRate * 1.5).toFixed(2) + " ₺";
            document.getElementById('rate20').innerText = (hRate * 2).toFixed(2) + " ₺";

            // Hareketleri Listele
            const tbody = document.getElementById('movementsBody');
            tbody.innerHTML = "";
            myRecords.reverse().slice(0, 10).forEach(r => {
                tbody.innerHTML += `<tr><td>${r.tarih}</td><td>${r.islem}</td></tr>`;
            });

            document.getElementById('grandTotal').innerText = maas.toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + " ₺";

        } catch (e) {
            console.error("Veri çekme hatası:", e);
            alert("Veriler yüklenemedi, lütfen tekrar giriş yapın.");
            logout();
        }
    }

    function downloadPDF() {
        const element = document.getElementById('pdf-content');
        const opt = {
            margin: 10,
            filename: 'Panotech_Ekstre.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    window.onload = renderPersonelData;
</script>
</body>
</html>
